<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ bot_name }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --board: #1f3a34;
      --board-dark: #162b26;
      --chalk: #f4f1e8;
      --chalk-dim: #b9c9c2;
      --yellow: #ffd45e;
      --coral: #ff8a6b;
      --paper: #fbf8ef;
      --ink: #26332f;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Nunito", sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background:
        radial-gradient(circle at 20% 20%, #2b5148 0, transparent 45%),
        radial-gradient(circle at 80% 80%, #24453d 0, transparent 40%),
        var(--board-dark);
      color: var(--chalk);
    }

    .app {
      width: 100%;
      max-width: 820px;
      height: 90vh;
      display: flex;
      flex-direction: column;
      background: var(--board);
      border: 10px solid #8b5e3c;
      border-radius: 18px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.45), inset 0 0 40px rgba(0, 0, 0, 0.25);
      overflow: hidden;
    }

    header {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 18px 24px;
      border-bottom: 2px dashed rgba(244, 241, 232, 0.25);
    }

    .logo {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      background: var(--yellow);
      color: var(--board-dark);
      display: grid;
      place-items: center;
      font-size: 26px;
      transform: rotate(-6deg);
    }

    header h1 {
      font-family: "Fraunces", serif;
      font-size: 24px;
      letter-spacing: 1px;
    }

    header p {
      font-size: 13px;
      color: var(--chalk-dim);
    }

    .clear-btn {
      margin-left: auto;
      background: transparent;
      color: var(--chalk);
      border: 2px solid rgba(244, 241, 232, 0.4);
      border-radius: 10px;
      padding: 8px 14px;
      font-family: inherit;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }

    .clear-btn:hover {
      background: var(--coral);
      border-color: var(--coral);
      color: var(--board-dark);
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    #messages::-webkit-scrollbar { width: 8px; }
    #messages::-webkit-scrollbar-thumb { background: rgba(244, 241, 232, 0.25); border-radius: 8px; }

    .message {
      max-width: 82%;
      padding: 12px 16px;
      border-radius: 16px;
      line-height: 1.6;
      font-size: 15.5px;
      white-space: pre-wrap;
      word-wrap: break-word;
      animation: pop 0.25s ease;
    }

    .message.bot {
      align-self: flex-start;
      background: var(--paper);
      color: var(--ink);
      border-bottom-left-radius: 4px;
    }

    .message.user {
      align-self: flex-end;
      background: var(--yellow);
      color: var(--board-dark);
      font-weight: 600;
      border-bottom-right-radius: 4px;
    }

    .message.error {
      background: var(--coral);
      color: var(--board-dark);
    }

    .typing {
      display: flex;
      gap: 5px;
      padding: 14px 18px;
    }

    .typing span {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--board);
      animation: bounce 1s infinite;
    }

    .typing span:nth-child(2) { animation-delay: 0.15s; }
    .typing span:nth-child(3) { animation-delay: 0.3s; }

    .input-area {
      display: flex;
      gap: 12px;
      padding: 16px 24px 20px;
      border-top: 2px dashed rgba(244, 241, 232, 0.25);
    }

    #input {
      flex: 1;
      resize: none;
      max-height: 120px;
      padding: 13px 16px;
      border-radius: 14px;
      border: 2px solid transparent;
      background: var(--paper);
      color: var(--ink);
      font-family: inherit;
      font-size: 15.5px;
      outline: none;
    }

    #input:focus { border-color: var(--yellow); }

    #send {
      width: 52px;
      border: none;
      border-radius: 14px;
      background: var(--yellow);
      color: var(--board-dark);
      font-size: 22px;
      cursor: pointer;
      transition: transform 0.15s;
    }

    #send:hover { transform: scale(1.06) rotate(-4deg); }
    #send:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    @keyframes pop {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); }
      30% { transform: translateY(-6px); }
    }

    @media (max-width: 600px) {
      body { padding: 0; }
      .app { height: 100vh; border-width: 6px; border-radius: 0; }
      .message { max-width: 92%; }
      header p { display: none; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="logo">🎓</div>
      <div>
        <h1>{{ bot_name }}</h1>
        <p>Your study companion</p>
      </div>
      <button class="clear-btn" id="clear">New Lesson</button>
    </header>

    <div id="messages"></div>

    <div class="input-area">
      <textarea id="input" rows="1" placeholder="Ask a study question..."></textarea>
      <button id="send" aria-label="Send">➤</button>
    </div>
  </div>

  <script>
    const welcome = {{ welcome | tojson }};
    const messagesEl = document.getElementById("messages");
    const inputEl = document.getElementById("input");
    const sendBtn = document.getElementById("send");
    const clearBtn = document.getElementById("clear");

    let history = [];

    function addMessage(text, type) {
      const div = document.createElement("div");
      div.className = "message " + type;
      div.textContent = text;
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      return div;
    }

    function showTyping() {
      const div = document.createElement("div");
      div.className = "message bot typing";
      div.innerHTML = "<span></span><span></span><span></span>";
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      return div;
    }

    async function sendMessage() {
      const text = inputEl.value.trim();
      if (!text) return;

      addMessage(text, "user");
      inputEl.value = "";
      inputEl.style.height = "auto";
      sendBtn.disabled = true;

      const typing = showTyping();

      try {
        const response = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: text, history })
        });
        const data = await response.json();
        typing.remove();

        if (data.reply) {
          addMessage(data.reply, "bot");
          history.push({ role: "user", text });
          history.push({ role: "model", text: data.reply });
        } else {
          addMessage(data.error || "Something went wrong.", "bot error");
        }
      } catch (error) {
        typing.remove();
        addMessage("Network error. Please try again.", "bot error");
      }

      sendBtn.disabled = false;
      inputEl.focus();
    }

    function resetChat() {
      history = [];
      messagesEl.innerHTML = "";
      addMessage(welcome, "bot");
    }

    sendBtn.addEventListener("click", sendMessage);
    clearBtn.addEventListener("click", resetChat);

    inputEl.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        sendMessage();
      }
    });

    inputEl.addEventListener("input", () => {
      inputEl.style.height = "auto";
      inputEl.style.height = inputEl.scrollHeight + "px";
    });

    resetChat();
  </script>
</body>
</html>
